name: CI

# Runs the API tests on every push. Deployment to Azure is a separate,
# manually started workflow (azure-webapp-deploy.yml).
on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm test
